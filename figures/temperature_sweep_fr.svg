<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="440" viewBox="0 0 1072 440" font-family="Roboto, -apple-system, system-ui, sans-serif" role="img" aria-labelledby="ts-titre ts-desc"><title id="ts-titre">Moyenne géométrique contre arithmétique, et balayage en température, pour une distribution discrète</title><desc id="ts-desc">À gauche : un diagramme en barres d'une distribution discrète avec la moyenne géométrique et la moyenne arithmétique marquées, illustrant l'inégalité de Jensen. À droite : la probabilité effective exp(-H_beta) quand beta balaie de chaud (uniforme) à froid (effondré sur le mode), avec beta=1 retrouvant le L de cette note.</desc><style>@media (prefers-color-scheme: dark){[fill="#FFFFFF"]{fill:#000;}[fill="#1D1D1F"]{fill:#F5F5F7;}[fill="#6E6E73"]{fill:#98989D;}[stroke="#E5E5EA"]{stroke:#2C2C2E;}}</style><rect width="1072" height="440" fill="#FFFFFF"/><svg x="0.0" y="0.0" width="520" height="440" viewBox="0 0 520 440"><rect width="520.0" height="440.0" fill="#FFFFFF"/><text x="64.0" y="34" font-size="19" font-weight="700" fill="#1D1D1F">Une distribution discrète sur K = 4 catégories</text><text x="64.0" y="56" font-size="14" fill="#6E6E73">p = (0,50, 0,30, 0,15, 0,05)</text><line x1="64.0" y1="360.0" x2="480.0" y2="360.0" stroke="#E5E5EA" stroke-width="1"/><text x="54.0" y="364.0" text-anchor="end" font-family="Roboto Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#6E6E73">0.0</text><line x1="64.0" y1="270.0" x2="480.0" y2="270.0" stroke="#E5E5EA" stroke-width="1"/><text x="54.0" y="274.0" text-anchor="end" font-family="Roboto Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#6E6E73">0.2</text><line x1="64.0" y1="180.0" x2="480.0" y2="180.0" stroke="#E5E5EA" stroke-width="1"/><text x="54.0" y="184.0" text-anchor="end" font-family="Roboto Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#6E6E73">0.4</text><line x1="64.0" y1="90.0" x2="480.0" y2="90.0" stroke="#E5E5EA" stroke-width="1"/><text x="54.0" y="94.0" text-anchor="end" font-family="Roboto Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#6E6E73">0.6</text><rect x="99.2" y="135.0" width="60.0" height="225.0" rx="4" fill="#007AFF"/><text x="129.2" y="127.0" text-anchor="middle" font-family="Roboto Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#1D1D1F">0.50</text><text x="129.2" y="380.0" text-anchor="middle" font-size="13" fill="#1D1D1F">1</text><rect x="194.4" y="225.0" width="60.0" height="135.0" rx="4" fill="#007AFF"/><text x="224.4" y="217.0" text-anchor="middle" font-family="Roboto Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#1D1D1F">0.30</text><text x="224.4" y="380.0" text-anchor="middle" font-size="13" fill="#1D1D1F">2</text><rect x="289.6" y="292.5" width="60.0" height="67.5" rx="4" fill="#007AFF"/><text x="319.6" y="284.5" text-anchor="middle" font-family="Roboto Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#1D1D1F">0.15</text><text x="319.6" y="380.0" text-anchor="middle" font-size="13" fill="#1D1D1F">3</text><rect x="384.8" y="337.5" width="60.0" height="22.5" rx="4" fill="#007AFF"/><text x="414.8" y="329.5" text-anchor="middle" font-family="Roboto Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#1D1D1F">0.05</text><text x="414.8" y="380.0" text-anchor="middle" font-size="13" fill="#1D1D1F">4</text><line x1="64.0" y1="360.0" x2="480.0" y2="360.0" stroke="#1D1D1F" stroke-width="1.5"/><line x1="64.0" y1="216.4" x2="480.0" y2="216.4" stroke="#FF3B30" stroke-width="2.2" stroke-dasharray="7 5"/><line x1="64.0" y1="195.7" x2="480.0" y2="195.7" stroke="#34C759" stroke-width="2.2" stroke-dasharray="3 4"/><rect x="222.0" y="92.0" width="258" height="54" rx="8" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/><line x1="230.0" y1="108.0" x2="252.0" y2="108.0" stroke="#FF3B30" stroke-width="2.5" stroke-dasharray="5 4"/><text x="260.0" y="112.0" font-size="12.5" fill="#1D1D1F">