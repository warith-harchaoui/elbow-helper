  <style>

<script src="./gate/track.js" defer></script>
<script src="./backend-pyodide.js"></script>
<script>
// --- tiny state ------------------------------------------------------------
"use strict";
let LANG = document.documentElement.lang === "fr" ? "fr" : "en";
let THEME = document.documentElement.classList.contains("dark") ? "dark" : "light";
let T = {};                 // gui strings for LANG, from ./i18n/<lang>.json
let lastSvg = null;         // the untouched SVG string, for downloads
let lastResult = null;      // the JSON verdict, for language re-renders
let currentPreset = null;   // preset id, or null for user data
let presetLabels = null;    // {x_label: {en,fr}, y_label: {en,fr}} of the preset

const $ = (id) => document.getElementById(id);

// --- backend ---------------------------------------------------------------
// Every data operation goes through this one object. The static build defines
// window.backend (backend-pyodide.js, loaded just above): an in-browser
// Python engine. There is no server twin, so a missing backend is an error.
const backend = window.backend || {
  i18n: async () => { throw new Error("backend-pyodide.js missing"); },
  preset: async () => { throw new Error("backend-pyodide.js missing"); },
  analyze: async () => { throw new Error("backend-pyodide.js missing"); },
  version: async () => "",
};

// --- global activity indicator ----------------------------------------------
// A counter rather than a boolean: overlapping operations each take their own
// slot, so the header ring stays lit until the LAST one finishes. Wrapping the
// backend object covers every data call without per-call wiring; `ehBusy` is
// the same mechanism exposed to the engine boot, which starts on its own and
// is the longest wait the visitor ever sees (see backend-pyodide.js boot()).
let busyCount = 0;
function busyStart() { busyCount++; $("busy").classList.remove("hidden"); }
function busyEnd() { busyCount = Math.max(0, busyCount - 1); if (!busyCount) $("busy").classList.add("hidden"); }
window.ehBusy = { start: busyStart, end: busyEnd };
for (const key of Object.keys(backend)) {
  const op = backend[key];
  backend[key] = async (...args) => { busyStart(); try { return await op(...args); } finally { busyEnd(); } };
}

// --- i18n --------------------------------------------------------------------
function t(key, vars) {
  let s = T[key] != null ? T[key] : key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll("{" + k + "}", String(v));
  return s;
}

function applyI18n() {
  document.documentElement.lang = LANG;
  document.title = t("doc_title");
  const meta = document.querySelector('meta[name="description"]');
  if (meta && T.meta_description) meta.setAttribute("content", T.meta_description);
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const k = el.getAttribute("data-i18n");
    if (T[k] != null) el.textContent = T[k];
  });
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
    const k = el.getAttribute("data-i18n-aria");
    if (T[k] != null) el.setAttribute("aria-label", T[k]);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
    const k = el.getAttribute("data-i18n-ph");
    if (T[k] != null) el.setAttribute("placeholder", T[k]);
  });
  $("landscapeLink").href = LANG === "fr"
    ? "https://github.com/warith-harchaoui/elbow-helper/blob/main/PAYSAGE.md"
    : "https://github.com/warith-harchaoui/elbow-helper/blob/main/LANDSCAPE.md";
  updateToggles();
  updatePointsCount();
  if (lastResult) renderVerdictText();
}

function updateToggles() {
  const langBtn = $("langToggle");
  // The flag shows the language you would SWITCH TO (like the sun/moon
  // shows the theme you would switch to), not the current one.
  langBtn.textContent = LANG === "fr" ? "🇬🇧" : "🇫🇷";
  langBtn.setAttribute("aria-label", t("lang_aria"));
  const dark = document.documentElement.classList.contains("dark");
  const themeBtn = $("themeToggle");
  themeBtn.textContent = dark ? "🌞" : "🌛";
  themeBtn.setAttribute("aria-label", t(dark ? "theme_to_light_aria" : "theme_to_dark_aria"));
}

async function loadI18n() {
  try { T = await backend.i18n(LANG); } catch (e) { T = {}; }
  applyI18n();
}

// --- data parsing -------------------------------------------------------------
// One point per line: a single y, or an x,y pair split on comma / semicolon /
// tab / spaces. A non-numeric first line (a CSV header) is skipped.
function parsePoints(text) {
  const rows = [];
  const lines = text.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const parts = line.split(/[,;\t ]+/).map(Number);
    if (parts.some((v) => !isFinite(v))) {
      if (rows.length === 0 && i === 0) continue; // header line
      return null;
    }
    rows.push(parts);
  }
  if (!rows.length) return null;
  const cols = rows[0].length;
  if (!rows.every((r) => r.length === cols) || cols > 2) return null;
  if (cols === 1) return { x: null, y: rows.map((r) => r[0]) };
  return { x: rows.map((r) => r[0]), y: rows.map((r) => r[1]) };
}

function updatePointsCount() {
  const parsed = parsePoints($("points").value);
  $("pointsCount").textContent = parsed ? t("points_count", { n: parsed.y.length }) : t("points_none");
}

// --- number formatting ---------------------------------------------------------
function fmt(v) {
  if (v == null || !isFinite(v)) return String(v);
  const s = Number(v).toPrecision(4);
  return String(Number(s)); // drops trailing zeros
}

// --- presets --------------------------------------------------------------------
async function loadPreset(id) {
  hideError();
  try {
    const p = await backend.preset(id);
    currentPreset = id;
    presetLabels = { x_label: p.x_label, y_label: p.y_label };
    $("points").value = p.x.map((xv, i) => xv + "," + p.y[i]).join("\n");
    $("curve").value = p.curve;
    $("direction").value = p.direction;
    $("xLabel").value = p.x_label[LANG] || p.x_label.en;
    $("yLabel").value = p.y_label[LANG] || p.y_label.en;
    $("logY").checked = false;
    document.querySelectorAll("[data-preset]").forEach((el) => {
      el.setAttribute("aria-pressed", el.getAttribute("data-preset") === id ? "true" : "false");
    });
    updatePointsCount();
  } catch (e) {
    showError(e.message || String(e));
  }
}

// --- analyze --------------------------------------------------------------------
function showError(msg) {
  const el = $("error");
  el.textContent = t("error_prefix") + msg;
  el.classList.remove("hidden");
}
function hideError() { $("error").classList.add("hidden"); }

function renderVerdictText() {
  const r = lastResult;
  if (!r) return;
  if (r.is_clear) {
    $("verdictTitle").textContent = t("verdict_clear_title", { x: fmt(r.knee_x) });
    $("verdictBody").textContent = t("verdict_clear_body", {
      lo: fmt(r.ci90[0]),
      hi: fmt(r.ci90[1]),
      rate: Math.round(r.detection_rate * 100),
      p: Number(Number(r.null_p_value).toPrecision(2)),
    });
  } else {
    $("verdictTitle").textContent = t("verdict_abstain_title");
    $("verdictBody").textContent = t("verdict_abstain_body", {
      reason_text: t("reason_" + r.reason),
      code: r.reason,
    });
  }
}

async function analyze() {
  hideError();
  const parsed = parsePoints($("points").value);
  if (!parsed) { showError(t("error_parse")); return; }
  if (parsed.y.length < 20) { showError(t("error_too_few", { n: parsed.y.length })); return; }
  const btn = $("run");
  btn.disabled = true;
  btn.setAttribute("aria-busy", "true");
  const runLabel = btn.textContent;
  btn.textContent = t("running");
  $("status").textContent = window.__engineReady ? t("status_running") : t("status_booting");
  try {
    const out = await backend.analyze({
      x: parsed.x != null ? parsed.x : parsed.y,
      y: parsed.x != null ? parsed.y : null,
      curve: $("curve").value || null,
      direction: $("direction").value || null,
      language: LANG,
      x_label: $("xLabel").value.trim() || null,
      y_label: $("yLabel").value.trim() || null,
      log_y: $("logY").checked,
    });
    lastSvg = out.svg;
    lastResult = out.result;
    renderVerdictText();
    // The SVG carries its own prefers-color-scheme dark block, meant for the
    // standalone file. In the page the theme is a class, so strip that block
    // (the stylesheet above replicates its rules under .dark).
    $("figure").innerHTML = out.svg.replace(/<style>@media[^<]*<\/style>/, "");
    $("verdictPlaceholder").classList.add("hidden");
    $("verdict").classList.remove("hidden");
    $("evidence").querySelector("pre").textContent = JSON.stringify(lastResult, null, 2);
    $("status").textContent = t("status_done", { s: out.elapsed_s });
  } catch (e) {
    showError(e.message || String(e));
    $("status").textContent = "";
  } finally {
    btn.disabled = false;
    btn.removeAttribute("aria-busy");
    btn.textContent = T.run || runLabel;
  }
}

// --- downloads --------------------------------------------------------------------
function downloadBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function slug() { return "elbow-helper-" + (currentPreset || "curve"); }

$("dlSvg").addEventListener("click", () => {
  if (!lastSvg) return;
  downloadBlob(new Blob([lastSvg], { type: "image/svg+xml" }), slug() + ".svg");
});
$("dlPng").addEventListener("click", () => {
  if (!lastSvg) return;
  const img = new Image();
  const url = URL.createObjectURL(new Blob([lastSvg], { type: "image/svg+xml" }));
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob) => { if (blob) downloadBlob(blob, slug() + ".png"); URL.revokeObjectURL(url); }, "image/png");
  };
  img.src = url;
});

// --- wiring ---------------------------------------------------------------------
document.querySelectorAll("[data-preset]").forEach((el) => {
  el.addEventListener("click", () => loadPreset(el.getAttribute("data-preset")));
});
$("points").addEventListener("input", () => {
  currentPreset = null;
  presetLabels = null;
  document.querySelectorAll("[data-preset]").forEach((el) => el.setAttribute("aria-pressed", "false"));
  updatePointsCount();
});
$("upload").addEventListener("click", () => $("uploadFile").click());
$("uploadFile").addEventListener("change", async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  $("points").value = await file.text();
  currentPreset = null;
  updatePointsCount();
  ev.target.value = "";
});
$("run").addEventListener("click", analyze);

$("langToggle").addEventListener("click", () => {
  const previous = LANG;
  LANG = LANG === "fr" ? "en" : "fr";
  localStorage.setItem("eh-lang", LANG);
  // A preset's axis captions follow the language as long as the visitor has
  // not edited them by hand.
  if (presetLabels) {
    if ($("xLabel").value === presetLabels.x_label[previous]) $("xLabel").value = presetLabels.x_label[LANG];
    if ($("yLabel").value === presetLabels.y_label[previous]) $("yLabel").value = presetLabels.y_label[LANG];
  }
  loadI18n();
});
$("themeToggle").addEventListener("click", () => {
  document.documentElement.classList.toggle("dark");
  THEME = document.documentElement.classList.contains("dark") ? "dark" : "light";
  localStorage.setItem("eh-theme", THEME);
  updateToggles();
});

// --- boot ------------------------------------------------------------------------
loadI18n();
if (backend.version) {
  backend.version().then((v) => { if (v) $("version").textContent = "v" + v; }).catch(() => {});
}
</script>
