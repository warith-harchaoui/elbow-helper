<!-- SEO / GEO block, injected by build.py into the STATIC build only. {BASE}
     is replaced with the deployment URL at build time. Single URL, bilingual
     app: og:locale declares EN with an FR alternate; the language toggle is
     client-side, so there are no per-language URLs to hreflang to. -->
<link rel="canonical" href="{BASE}/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="elbow-helper" />
<meta property="og:title" content="elbow-helper: is that elbow real?" />
<meta property="og:description" content="Noise-robust knee and elbow detection: a knee with its uncertainty or a frank abstention, computed entirely in your browser. Nothing is uploaded, no account, free and open source." />
<meta property="og:url" content="{BASE}/" />
<meta property="og:image" content="{BASE}/static/og-card.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="elbow-helper: an engraved articulated elbow brace next to the baseline 'Is that elbow real?' / 'Le coude est-il réel ?'." />
<meta property="og:locale" content="en_US" />
<meta property="og:locale:alternate" content="fr_FR" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="elbow-helper: is that elbow real?" />
<meta name="twitter:description" content="A curve in, a validated knee with its confidence interval out; a frank abstention otherwise. Runs entirely in your browser." />
<meta name="twitter:image" content="{BASE}/static/og-card.png" />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "elbow-helper",
  "alternateName": "Le coude est-il réel ?",
  "url": "{BASE}/",
  "description": "elbow-helper locates the knee (or elbow) of a curve of diminishing returns and validates it: scale-space persistence, a segmented-model check, a bootstrap confidence interval and a no-knee null test. A knee is reported with its uncertainty; otherwise the tool abstains with an explicit reason. The pipeline, the diagnostic figure and the exports all run in the visitor's browser via WebAssembly; no data leaves the machine.",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "Any (web browser)",
  "browserRequirements": "Requires JavaScript and WebAssembly",
  "inLanguage": ["en", "fr"],
  "image": "{BASE}/static/og-card.png",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
  "license": "https://opensource.org/license/bsd-3-clause",
  "isAccessibleForFree": true,
  "author": {
    "@type": "Person",
    "name": "Warith Harchaoui",
    "url": "https://deraison.ai"
  },
  "sameAs": [
    "https://github.com/warith-harchaoui/elbow-helper",
    "https://pypi.org/project/elbow-helper/"
  ]
}
</script>
