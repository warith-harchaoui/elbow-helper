[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elbow-helper"
version = "0.1.7"
description = "Noise-robust knee/elbow detection: a conservative wrapper around a from-scratch locator that either returns a knee with uncertainty or explicitly abstains."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Warith Harchaoui", email = "warithmetics@deraison.ai" }]
keywords = ["knee", "elbow", "model-selection", "k-means", "changepoint"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

# Hard dependencies: numpy + os-helper ONLY.
dependencies = [
    "numpy>=1.24",
    "os-helper>=1.8",
]

[project.optional-dependencies]
# Diagnostic plotting (elbow_helper.plotting) is hand-written SVG, stdlib +
# numpy only — no extra to install, no matplotlib. See CHANGELOG [Unreleased].
# The other three "doors" beyond the library + argparse CLI.
cli = ["click>=8.1,<9"]                     # optional click twin (argparse is always on)
api = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
# fastapi-mcp mounts the MCP server onto a FastAPI app (see mcp_server.py), so
# this extra needs the api extra's own deps too. `mcp<2` is pinned because
# fastapi-mcp 0.4.x calls the mcp SDK's Server() with a positional signature
# that mcp 2.0 broke (TypeError at import time) — the same pin ann-router and
# other suite members carry; lift it once a fastapi-mcp release compatible
# with mcp>=2 ships.
mcp = ["fastapi-mcp>=0.4,<1", "mcp<2,>=1.20", "fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
# ruff is listed because .githooks/pre-push blocks on it: a gate whose tool is
# not a declared dependency is a gate that passes or fails by accident of what
# happens to be on PATH.
dev = ["pytest>=7", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
# argparse CLI — no runtime dependency beyond the stdlib + core package.
elbow-helper = "elbow_helper.cli_argparse:main"
# click twin — install with the [cli] extra.
elbow-helper-click = "elbow_helper.cli_click:main"
# HTTP API + MCP server (needs [mcp]) — fastapi-mcp mounts /mcp on the same
# FastAPI app api.py serves, so one entry point covers both doors.
elbow-helper-mcp = "elbow_helper.mcp_server:main"

[project.urls]
Homepage = "https://github.com/warith-harchaoui/elbow-helper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Ruff is a blocking gate: .githooks/pre-push refuses to push on a failing
# `ruff check .` or `ruff format --check .`. A gate with no configuration is
# not a gate, it is a hostage to the linter's release notes -- ruff's default
# rule selection widened between releases, and a Tuesday upgrade turned a
# green repository red with 292 findings in code nobody had touched. What
# follows is therefore an explicit statement of what this project lints for,
# so the answer stops depending on which ruff is installed.
[tool.ruff]
# Python only. Ruff 0.16 began formatting Python blocks inside Markdown, which
# this project never opted into and does not want: EXAMPLES.md, EXEMPLES.md and
# both READMEs carry hand-written teaching examples whose line breaks are
# chosen for reading, and the formatter would explode every compact call
# signature across five lines to no one's benefit.
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-exclude = ["build", "dist", "webapp/dist", ".private"]

[tool.ruff.lint]
# Correctness first (F for undefined names and dead imports, E4/E7/E9 and W
# for the pycodestyle checks that catch real mistakes rather than taste), then
# the likely-bug patterns (B), then the two consistency rules worth enforcing
# mechanically (I for import order, C4 for comprehensions), then modernization
# and ruff's own checks (UP, RUF).
#
# Plain `E` is deliberately not selected, because it carries E501. This is a
# documentation-heavy library -- most modules are more docstring than code --
# and the formatter does not rewrap prose, so E501 would mean hand-rewrapping
# 179 lines of explanation to satisfy a column count. The formatter still
# holds *code* to line-length below; prose is left to the writer.
select = ["E4", "E7", "E9", "W", "F", "I", "B", "BLE", "C4", "UP", "RUF"]

# Deliberately not enforced, with reasons:
#
# UP006/UP035/UP045 want `list[int]`, `collections.abc`, and `int | None` in
# place of `List[int]`, `typing.List`, and `Optional[int]`. The package is
# written the other way throughout -- every module opens with
# `from __future__ import annotations` and annotates with `typing` generics --
# and that is internally consistent, valid at the supported floor of Python
# 3.10, and 242 findings wide. Converting it would be a six-thousand-line
# diff that buries every real change made alongside it. Picking one style and
# holding it is worth more here than picking the newer one.
#
# BLE (blind `except Exception`) is selected rather than ignored, which is why
# it appears in the list above: three files already carried `# noqa: BLE001`
# with a reason attached, so the convention was the author's, not an
# invention here -- the remaining safety nets were simply missing the marker
# and now carry it. Suppressing a rule per site with a stated reason keeps it
# catching the *accidental* blind except that a blanket ignore waves through.
# Note that selecting `B` does not select `BLE`: ruff resolves linter prefixes,
# so `B` is bugbear alone.
#
# E402 is likewise left enabled: the figure and research scripts that must
# prepend to sys.path before importing already carry `# noqa: E402` on the
# exact import that needs it.
#
# B905 wants `strict=` on every `zip()`. The flag changes runtime behaviour --
# it raises on a length mismatch rather than truncating -- so adding it in 27
# places across numerical code is a behavioural change dressed as a lint fix,
# and not one to make without checking each call site against what it iterates.
# Worth doing deliberately, not mechanically.
#
# RUF001/RUF002 flag ambiguous Unicode in strings and docstrings. This is a
# bilingual project whose prose uses typographic punctuation throughout, and a
# mathematics library where `×` means what it looks like; the "ambiguity" is
# with lookalike codepoints the project does not use.
#
# RUF022 wants `__all__` sorted alphabetically. It is grouped by role instead
# -- the three entry points, then the configs, then each result union with its
# members -- which tells a reader what the package offers; the alphabet tells
# them nothing.
#
# UP032 rewrites `"...".format(...)` as an f-string. Correct in general, but
# its fix inlines every argument into the literal, and on a call with four
# computed arguments that produced one 250-character line out of a readable
# seven-line block. Left to the author to do where it reads better.
ignore = [
    "UP006",
    "UP035",
    "UP045",
    "UP032",
    "B905",
    "RUF001",
    "RUF002",
    "RUF022",
]

[tool.ruff.lint.isort]
# `conftest`, the research package's sibling modules and the figure scripts'
# shared helper are imported by bare name after a sys.path insert, so ruff
# reads them as third-party and hoists them above `elbow_helper`. They are
# local to their directory and belong after it, which is where they were
# written.
known-local-folder = [
    "conftest",
    "compare",
    "criteria",
    "fwer",
    "segmentation",
    "synthetic",
    "generate_experiment_figures",
]
